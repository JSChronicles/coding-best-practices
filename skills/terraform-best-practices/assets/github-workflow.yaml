# Template asset for terraform-best-practices.
# This is the only workflow allowed to create the saved deployment plan.
# Replace every __...__ placeholder before use. Resolve current action releases
# with github-actions-best-practices, then use an Actions lockfile or full SHAs.
name: Terraform Validation and Plan

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: terraform-validation-${{ github.workflow }}-${{ github.ref_name }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: terraform

jobs:
  validate-and-plan:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@__CHECKOUT_REF__
        with:
          persist-credentials: false

      - name: Install Terraform
        uses: hashicorp/setup-terraform@__SETUP_TERRAFORM_REF__
        with:
          terraform_version: "__TERRAFORM_VERSION__"

      - name: Authenticate planning identity with OIDC
        uses: __CLOUD_OIDC_ACTION__@__CLOUD_OIDC_ACTION_REF__
        with:
          __CLOUD_ROLE_INPUT__: ${{ vars.__PLAN_ROLE_VARIABLE__ }}
          __CLOUD_REGION_INPUT__: ${{ vars.__REGION_VARIABLE__ }}

      - name: Check formatting
        run: terraform fmt -check -diff -recursive

      - name: Initialize remote backend
        run: terraform init -reconfigure -input=false -no-color -lockfile=readonly

      - name: Validate configuration
        run: terraform validate -no-color

      - name: Run Terraform tests
        run: terraform test -no-color

      - name: Create saved deployment plan
        run: terraform plan -input=false -no-color -out=tfplan

      - name: Record plan provenance
        env:
          PLAN_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          PLAN_TERRAFORM_VERSION: "__TERRAFORM_VERSION__"
          PLAN_TARGET_ENVIRONMENT: "__ENVIRONMENT__"
        shell: bash
        run: |
          jq -n \
            --arg source_sha "$PLAN_SOURCE_SHA" \
            --arg terraform_version "$PLAN_TERRAFORM_VERSION" \
            --arg target_environment "$PLAN_TARGET_ENVIRONMENT" \
            --arg lock_sha256 "$(sha256sum .terraform.lock.hcl | cut -d ' ' -f 1)" \
            '{
              source_sha: $source_sha,
              terraform_version: $terraform_version,
              target_environment: $target_environment,
              lock_sha256: $lock_sha256
            }' > plan-metadata.json

      - name: Upload saved plan and provenance
        uses: actions/upload-artifact@__UPLOAD_ARTIFACT_REF__
        with:
          name: tfplan
          path: |
            terraform/tfplan
            terraform/plan-metadata.json
          if-no-files-found: error
          retention-days: 7
