# Template asset for python-best-practices.
# Replace every __...__ placeholder before use. Resolve current action releases
# with github-actions-best-practices, then use an Actions lockfile or full SHAs.
name: Python CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: python-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@__CHECKOUT_REF__
        with:
          persist-credentials: false

      - name: Install uv and Python
        uses: astral-sh/setup-uv@__SETUP_UV_REF__
        with:
          python-version: "__PYTHON_VERSION__"

      - name: Install development environment
        run: uv sync --locked --all-extras --all-groups

      - name: Check formatting
        run: uv run ruff format --check .

      - name: Lint
        run: uv run ruff check --output-format=github .

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@__CHECKOUT_REF__
        with:
          persist-credentials: false

      - name: Install uv and Python
        uses: astral-sh/setup-uv@__SETUP_UV_REF__
        with:
          python-version: "__PYTHON_VERSION__"

      - name: Install development environment
        run: uv sync --locked --all-extras --all-groups

      - name: Run tests
        run: uv run pytest --cov

      - name: Build distributions
        run: uv build
