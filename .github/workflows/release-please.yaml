name: Release Please

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions: {}

concurrency:
  group: release-please-main
  cancel-in-progress: false

jobs:
  release:
    name: Propose or publish release
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Create release bot token
        id: app-token
        uses: actions/create-github-app-token@v3.4.0
        with:
          client-id: ${{ secrets.PYTHON_RELEASE_BOT_CLIENT_ID }}
          private-key: ${{ secrets.PYTHON_RELEASE_BOT_PRIVATE_KEY }}
          permission-contents: write
          permission-issues: write
          permission-pull-requests: write

      - name: Create or update release
        uses: googleapis/release-please-action@v5.0.0
        with:
          token: ${{ steps.app-token.outputs.token }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
