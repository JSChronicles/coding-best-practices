name: Release

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  release:
    name: Tag semantic release
    if: >-
      github.ref == 'refs/heads/main' &&
      (github.event_name != 'push' ||
      !startsWith(github.event.head_commit.message, 'chore(release):'))
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Create release bot token
        id: app-token
        uses: actions/create-github-app-token@v3.4.0
        with:
          client-id: ${{ secrets.PYTHON_RELEASE_BOT_CLIENT_ID }}
          private-key: ${{ secrets.PYTHON_RELEASE_BOT_PRIVATE_KEY }}
          permission-contents: write

      - name: Checkout main
        uses: actions/checkout@v7.0.1
        with:
          token: ${{ steps.app-token.outputs.token }}
          ref: main
          fetch-depth: 0

      - name: Pin main to workflow SHA
        run: git reset --hard ${{ github.sha }}

      - name: Install uv and Python
        uses: astral-sh/setup-uv@v10.4.0
        with:
          version: "0.13.7"
          python-version: "3.14"
          enable-cache: false

      - name: Verify release baseline tag
        shell: bash
        run: |
          if ! git tag --list 'v*' | grep -q .; then
            current_version="$(uv run --no-project python -c 'import json; print(json.load(open("plugin.json"))["version"])')"
            echo "::error::No v* release tags exist. Create baseline tag v${current_version} on the current release commit before enabling semantic-release."
            exit 1
          fi

      - name: Validate skills and plugin metadata
        run: uv run scripts/validate_skills.py

      - name: Create semantic release
        id: release
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          GIT_COMMIT_AUTHOR: ${{ steps.app-token.outputs.app-slug }}[bot] <${{ steps.app-token.outputs.app-slug }}[bot]@users.noreply.github.com>
          UV_CACHE_DIR: ./.uv-cache
        shell: bash
        run: |
          git config user.name "${{ steps.app-token.outputs.app-slug }}[bot]"
          git config user.email "${{ steps.app-token.outputs.app-slug }}[bot]@users.noreply.github.com"
          uvx --from python-semantic-release==10.7.0 semantic-release --config semantic-release.toml version
          tag="$(git tag --points-at HEAD --list 'v*' | sort -V | tail -n 1)"
          if [ -n "$tag" ]; then
            echo "released=true" >> "$GITHUB_OUTPUT"
            echo "tag=$tag" >> "$GITHUB_OUTPUT"
          else
            echo "released=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Release summary
        shell: bash
        run: |
          if [ "${{ steps.release.outputs.released }}" = "true" ]; then
            echo "Released ${{ steps.release.outputs.tag }}"
          else
            echo "No release generated from this push"
          fi
